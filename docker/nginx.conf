server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Keep redirects relative so they survive host/port remapping by compose.
    absolute_redirect off;

    # Never cache HTML by default; hashed assets below override this.
    add_header Cache-Control "no-store" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # src/index.html has <base href="/petclinic/"> - the app only lives there.
    location = / {
        return 302 /petclinic/;
    }

    location = /petclinic/ {
        try_files /petclinic/index.html =404;
    }

    # Same-origin proxy to the rest service, so the Angular app (baked with
    # REST_API_URL=/petclinic/api/) never makes a cross-origin request - the
    # browser only ever talks to whatever host:port loaded this page, whether
    # that's a human on localhost:8080 or Playwright on angular:8080.
    location /petclinic/api/ {
        # proxy_pass with a bare hostname resolves once at nginx startup and
        # is fatal (host not found in upstream) if `rest` isn't up yet -
        # compose starts angular and rest concurrently, so that race is real.
        # Routing through a variable defers resolution to request time via
        # Docker's embedded DNS (127.0.0.11), so nginx starts either way and
        # only 502s until rest is actually reachable.
        resolver 127.0.0.11 valid=10s;
        set $rest_upstream rest:9966;
        # $request_uri (not a rewritten/appended path) because proxy_pass with
        # a variable skips nginx's usual location-prefix substitution - and
        # this proxy path is identical to the rest service's own context
        # path, so passing the original URI through verbatim is correct.
        proxy_pass http://$rest_upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Hashed, immutable build output. This regex location outranks the prefix
    # location below, which is what we want: a missing JS/CSS file must 404,
    # not silently fall back to index.html (that failure mode is very hard to
    # debug from a blank/broken page).
    location ~* \.(?:js|mjs|css|map|woff2?|ttf|eot|svg|png|jpe?g|gif|ico|webp)$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # SPA deep links (e.g. /petclinic/owners/1): serve the real file if it
    # exists, otherwise fall back to the app shell so the Angular router can
    # take over.
    location /petclinic/ {
        try_files $uri $uri/ /petclinic/index.html;
    }
}
