name: petclinic

services:
  postgres:
    image: postgres:16.3
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-petclinic}
      POSTGRES_USER: ${POSTGRES_USER:-petclinic}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-petclinic}
      TZ: ${TZ:-UTC}
      PGTZ: ${TZ:-UTC}
    # Ephemeral PGDATA: every `up` starts empty, so schema.sql can't
    # accumulate duplicate auto-named indexes from repeated runs.
    tmpfs:
      - /var/lib/postgresql/data
    # Seeded once by Postgres itself via initdb.d, before the app connects
    # (only runs against an empty PGDATA - swapping in a named volume needs
    # `down -v` for seed edits to take effect).
    volumes:
      - ./spring-petclinic-rest/src/main/resources/db/postgres/schema.sql:/docker-entrypoint-initdb.d/10-schema.sql:ro
      - ./spring-petclinic-rest/src/main/resources/db/postgres/data.sql:/docker-entrypoint-initdb.d/20-data.sql:ro
    ports:
      - "${POSTGRES_HOST_PORT:-55432}:5432"
    healthcheck:
      # -h 127.0.0.1 forces TCP so this can't report healthy against the
      # initdb.d temp server; the row-count check makes "healthy" mean "seeded".
      test:
        - CMD-SHELL
        - >-
          pg_isready -h 127.0.0.1 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" &&
          psql -h 127.0.0.1 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" -tAc 'select count(*) from owners' | grep -qx 10
      interval: 3s
      timeout: 5s
      retries: 30
      start_period: 30s

  rest:
    build:
      context: .
      dockerfile: docker/rest.Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: postgres,spring-data-jpa
      # POSTGRES_PASS, not POSTGRES_PASSWORD - same value, different var name
      # than the postgres image above.
      POSTGRES_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-petclinic}
      POSTGRES_USER: ${POSTGRES_USER:-petclinic}
      POSTGRES_PASS: ${POSTGRES_PASSWORD:-petclinic}
      # Overrides application-postgres.properties' spring.sql.init.mode=always -
      # seeding is handled by postgres's initdb.d scripts above instead.
      SPRING_SQL_INIT_MODE: never
      TZ: ${TZ:-UTC}
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=75 -Duser.timezone=${TZ:-UTC}
    ports:
      - "${REST_HOST_PORT:-9966}:9966"
    # Not unless-stopped: a crash-restart loop would mask a real startup failure.
    restart: "no"

  angular:
    build:
      context: .
      dockerfile: docker/angular.Dockerfile
      args:
        # Baked in at build time - changing these needs `docker compose build angular`.
        REST_API_URL: ${REST_API_URL:-http://rest:9966/petclinic/api/}
        BASE_HREF: ${BASE_HREF:-/petclinic/}
    ports:
      - "${ANGULAR_HOST_PORT:-8080}:8080"
    restart: "no"

  # Only starts via `docker compose run --rm tests ...` or `--profile tests up`.
  tests:
    profiles: ["tests"]
    build:
      context: .
      dockerfile: docker/tests.Dockerfile
      args:
        PLAYWRIGHT_IMAGE: ${PLAYWRIGHT_IMAGE:-mcr.microsoft.com/playwright:v1.61.1-noble}
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    depends_on:
      rest:
        condition: service_healthy
      angular:
        condition: service_healthy
    user: "${UID:-1000}:${GID:-1000}"
    working_dir: /work/playwright
    # Avoids exhausting the default 64MB /dev/shm (Playwright's recommendation for Chromium).
    ipc: host
    environment:
      HOME: /home/tester
      NPM_CONFIG_CACHE: /tmp/.npm
      TZ: ${TZ:-UTC}
      PW_BASE_URL: http://angular:8080
      PW_API_URL: http://rest:9966/petclinic/api
      SEED_SQL_DIR: /srv/seed
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: ${POSTGRES_DB:-petclinic}
      PGUSER: ${POSTGRES_USER:-petclinic}
      PGPASSWORD: ${POSTGRES_PASSWORD:-petclinic}
    volumes:
      - ./playwright:/work/playwright
      # Named volume on the more specific path wins, keeping node_modules
      # independent of whatever the bind mount above brings from the host.
      - tests-node-modules:/work/playwright/node_modules
      # Seed SQL for resetDatabase(), read-only.
      - ./spring-petclinic-rest/src/main/resources/db/postgres:/srv/seed:ro
    # Only published with --service-ports (needed for --ui mode / show-report / show-trace).
    ports:
      - "${PW_UI_PORT:-9323}:9323"
    # `npx --no` fails fast instead of network-installing playwright if the volume is empty.
    command: ["npx", "--no", "playwright", "test"]

volumes:
  tests-node-modules:
